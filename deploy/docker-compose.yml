services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local"] # local dev only — production uses Supabase Postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kivlo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kivlo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kivlo
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||8787)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kivlo
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
